version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: workpay_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workpay_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: mongodb://mongodb:27017/workforce_wallet?directConnection=true
      JWT_ACCESS_SECRET: supersecret_access_jwt_key_2026_workpay_prod
      JWT_REFRESH_SECRET: supersecret_refresh_jwt_key_2026_workpay_prod
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 30d
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workpay_frontend
    restart: always
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongodata:
