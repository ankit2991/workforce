packages:
  - .
  - backend
  - frontend

onlyBuiltDependencies:
  - "@swc/core"
  - "@tailwindcss/oxide"
  - esbuild
  - "@prisma/client"
  - "@prisma/engines"
  - prisma

blockExoticSubdeps: true

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@usehercules/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  "@swc/core": true
  esbuild: true
  prisma: true
